[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bEnableFOVScaling=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; Enhanced Input. Классический ввод (BindAxis/BindAction) в новых версиях движка
; удалён, поэтому раскладка живёт не здесь, а в коде — см. BuildInputMappings
; в ADarkroomCharacter. Там же её и менять.
;
; Обычные Input Action и Mapping Context — бинарные ассеты, и проект, который от
; них зависит, не собрался бы из одних текстовых файлов. Поэтому они создаются
; прямо в конструкторе персонажа, а не загружаются с диска.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
