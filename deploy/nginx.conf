# nginx reverse proxy for Roost (non-Docker path).
# Handles the WebSocket upgrade on /ws and proxies everything to Node on :3000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/roost
#   sudo ln -s /etc/nginx/sites-available/roost /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then get a free SSL cert:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d roost.example.com
# certbot rewrites this file to add the SSL block and a 80->443 redirect.

server {
    listen 80;
    server_name roost.example.com;   # <-- replace with your domain

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
