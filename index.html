<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Фелар: Сердце Мшистого Леса</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/ic_gem.png" />
</head>
<body>
  <div id="stage">
    <canvas id="canvas" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div id="hearts"></div>
      <div id="gems">
        <img src="assets/ic_gem.png" alt="" />
        <span id="gemCount">0/0</span>
      </div>
      <div id="dashWrap" title="Рывок (Shift)">
        <div id="dashCd"></div>
        <span>⟫</span>
      </div>
      <div id="levelName"></div>
    </div>

    <div id="overlay"></div>

    <div id="touch" class="hidden">
      <div class="tside">
        <button id="tLeft">◀</button>
        <button id="tRight">▶</button>
      </div>
      <div class="tside">
        <button id="tDash">⟫</button>
        <button id="tJump">▲</button>
      </div>
    </div>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
