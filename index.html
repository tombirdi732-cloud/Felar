<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garry's Mod Loading Screen</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    .bg-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .bg {
      width: 100vw;
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      background: url('https://i.imgur.com/EgAjgay.jpeg') center center / cover no-repeat;
      filter: brightness(0.82) contrast(1.04);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.14) 28%, rgba(0,0,0,0.36) 100%);
      pointer-events: none;
    }
    .welcome {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 1200px);
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.55);
      z-index: 2;
    }
    .welcome h1 {
      margin: 0;
      font-size: clamp(28px, 4.5vw, 60px);
      font-weight: 700;
      line-height: 1.08;
    }
    .welcome p {
      margin: 12px 0 0;
      font-size: clamp(14px, 1.45vw, 20px);
      color: rgba(255,255,255,0.92);
    }
    @media (max-width: 900px) {
      .bg {
        width: auto;
        height: 100vh;
        aspect-ratio: auto;
        min-width: 100vw;
      }
      .welcome {
        top: 20px;
        width: calc(100vw - 24px);
      }
      .welcome p {
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="bg-wrap">
      <div class="bg"></div>
    </div>
    <div class="overlay"></div>
    <div class="welcome">
      <h1>Добро пожаловать на сервер</h1>
      <p>Приятной игры.</p>
    </div>
  </div>
</body>
</html>
